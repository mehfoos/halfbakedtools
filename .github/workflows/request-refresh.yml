name: Handle data refresh request

# Anyone can request a refresh from the website ("Request a data refresh"),
# which opens an issue from the data-refresh template. The refresh runs only if
# the snapshot is at least 3 months old; otherwise the issue is answered and closed.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'data-refresh')
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.age.outputs.due }}
      last: ${{ steps.age.outputs.last }}
      next: ${{ steps.age.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - id: age
        run: python3 -I data/pipeline/check_age.py --days 90
      - name: Decline if too recent
        if: steps.age.outputs.due != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body \
            "Thanks! The food data was last refreshed on ${{ steps.age.outputs.last }}. Refreshes run at most once every 3 months, so the next one is possible from ${{ steps.age.outputs.next }}."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason "not planned"

  refresh:
    needs: check
    if: needs.check.outputs.due == 'true'
    uses: ./.github/workflows/refresh-data.yml
    with:
      force: true

  report:
    needs: [check, refresh]
    if: always() && needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.refresh.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            body="Done: the food data has been refreshed and the site is being redeployed."
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$body"
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body \
              "The refresh didn't complete (see the Actions tab). A maintainer will take a look."
          fi
