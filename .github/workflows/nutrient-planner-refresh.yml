name: "Nutrient planner: refresh food data"

# Rebuilds the local food snapshot from USDA FoodData Central, archives the raw
# downloads as a GitHub release, commits the result and redeploys the site.
# Run by hand only (Actions tab), after a maintainer has checked the new USDA
# release: there is no schedule, because releases can change format or add
# files (owner's decision, 22 Nov 2026).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh even if the data is less than 3 months old"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nutrient-planner-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check age of current snapshot
        id: age
        run: python3 -I tools/nutrient-planner/pipeline/check_age.py --days 90
      - name: Build food snapshot
        if: steps.age.outputs.due == 'true' || inputs.force
        run: |
          python3 -I tools/nutrient-planner/pipeline/build_targets.py
          python3 -I tools/nutrient-planner/pipeline/build_foods.py --cache .cache/usda
      - name: Archive raw USDA downloads as a release
        if: steps.age.outputs.due == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="usda-data-$(date -u +%Y-%m-%d)"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" .cache/usda/*.zip --title "USDA data snapshot $(date -u +%Y-%m-%d)" \
              --notes "Raw USDA FoodData Central CSV downloads used to build tools/nutrient-planner/data/foods/foods.json (public domain)."
      - name: Commit
        id: commit
        if: steps.age.outputs.due == 'true' || inputs.force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/nutrient-planner/data/
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Nutrient planner: refresh food data snapshot ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
