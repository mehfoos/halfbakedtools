# One-off, after the Nov 2026 history clean-up (docs/PRINCIPLES.md decision log): moves the two release tags to the
# rewritten copies of the commits they marked, so nothing in the repository still points at the old history and
# GitHub can drop the old files. Run once from the Actions tab; it is then deleted.
name: Move release tags after history clean-up
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tags
        run: |
          set -e
          move() {
            git merge-base --is-ancestor "$2" origin/main  # the new target must be on the rewritten main
            git push --force origin "$2:refs/tags/$1"
            echo "- \`$1\` now points at \`$2\`" >> "$GITHUB_STEP_SUMMARY"
          }
          move source-archive 621fe93cf2b08f1048eaaa486a0f2e82390f274b
          move usda-data-2026-11-08 fc8edba8dd7ff778523f95cb7b6a2198c7745626
          git ls-remote --tags origin
