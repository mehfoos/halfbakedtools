# Checks the reference files listed in sources/archive.json against the "source-archive" release and records the
# verified checksums in sources/release-manifest.json. Run by hand from the Actions tab. It was used to fill the
# release with the files collected before Nov 2026 (downloading those it could from the official sites). New files
# are attached to the release by hand by the owner, after an editor has checked them; an editor then runs
# `python3 -I scripts/archive_release.py --check` (or this workflow) to verify them. See sources/README.md.
# Reference files are never committed to the repository.
name: Archive sources to release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the release exists
        run: |
          gh release view source-archive >/dev/null 2>&1 || gh release create source-archive \
            --title "Source archive" \
            --notes "Archived copies of reference files (datasets and documents) cited by Half-Baked Tools, kept here instead of in the repository. What each file is, its publisher, licence, origin and SHA-256 checksum are listed in sources/archive.json and sources/release-manifest.json. Each file keeps its publisher's licence."
      - name: Fetch, check and upload
        run: python3 -I scripts/archive_release.py
      - name: Commit the checksum list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/release-manifest.json
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Source archive: update release checksums"
          git push
