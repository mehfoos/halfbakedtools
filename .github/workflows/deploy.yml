name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/**", "sources/**", "scripts/**", "astro.config.mjs", "package*.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest, including fresh data commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        env:
          PUBLIC_REPO: ${{ github.repository }}
          # Set repository variables SITE_URL / SITE_BASE if not using the custom domain.
          SITE_URL: ${{ vars.SITE_URL || 'https://halfbakedtools.com' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
