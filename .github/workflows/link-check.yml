# Checks every reference and further-reading link every three months (1 January, April, July and October), or when
# run by hand from the Actions tab, and opens or updates one issue labelled "link-check" listing links that fail.
# It never changes files: an editor fixes each link, re-checks the source and updates its "accessed" date
# (principle 3 in AGENTS.md).
name: Link check
on:
  schedule:
    - cron: "17 6 1 1,4,7,10 *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        run: python3 -I scripts/check_links.py --report report.md
      - name: Open or update the issue
        run: |
          if grep -qE "^Checked [0-9]+ links: 0 broken, 0 unclear" report.md; then
            echo "All links fine."; exit 0
          fi
          gh label create link-check --color c5def5 --description "Links found failing by the link check" 2>/dev/null || true
          title="Link check: links to look at"
          n=$(gh issue list --label link-check --state open --json number --jq '.[0].number')
          { echo "Link check of $(date -u +%Y-%m-%d)."; echo; cat report.md; } > body.md
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "$title" --label link-check --body-file body.md; fi
