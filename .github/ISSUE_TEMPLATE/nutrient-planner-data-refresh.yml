name: "Nutrient planner: data refresh request"
description: Ask for the nutrient planner's food data to be updated, for example after a food table publishes a new release.
title: "Data refresh request: nutrient planner"
labels: ["data-refresh", "nutrient-planner"]
body:
  - type: markdown
    attributes:
      value: |
        Food data isn't updated automatically: a new release of a food table can change its format or add files,
        so a maintainer checks it by hand first. Tell us which table (and release, if you know) you'd like updated.
  - type: textarea
    id: reason
    attributes:
      label: Anything we should know? (optional)
